server:
  port: 8081
#  shutdown: graceful

spring:
  application:
    name: hotel-cms-backend
  datasource:
    url: jdbc:mysql://localhost:3306/hotel_cms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false
    locations: classpath:db/migration

app:
  jwt:
    secret: change-this-to-a-very-long-production-secret-at-least-64-characters
    access-token-minutes: 60
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,http://localhost:5174,http://192.168.1.8:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
